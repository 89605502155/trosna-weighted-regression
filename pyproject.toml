[project]
name = "trosna-weighted-regression"
version = "0.1.0"
description = "Time-weighted linear regression with protection against model 'falling asleep' on abrupt changes"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Andrey Ferubko", email = "ferubko1999@yandex.ru" }
]
requires-python = ">=3.11"
keywords = [
    "time-series",
    "regression",
    "weighted-least-squares",
    "change-point",
    "scikit-learn",
    "forecasting",
    "virtualization",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
    "numpy>=1.26",
    "scikit-learn>=1.6",
]

[project.urls]
Homepage = "https://github.com/89605502155/trosna-weighted-regression"
Repository = "https://github.com/89605502155/trosna-weighted-regression"
Documentation = "https://github.com/89605502155/trosna-weighted-regression#readme"
Issues = "https://github.com/89605502155/trosna-weighted-regression/issues"

[build-system]
requires = ["uv_build>=0.11.9,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "NPY", "RUF", "SIM", "PT", "C4", "PL"]
# Кириллица в комментариях и строках — не «опасные» символы.
# X с большой буквы и параметры эстиматора в __init__ — соглашения sklearn.
ignore = ["RUF001", "RUF002", "RUF003", "PLR2004", "PLR0913", "PLR0917", "N803", "N806"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["N806", "PLR0915"]

[tool.ruff.lint.isort]
known-first-party = ["trosna_weighted_regression"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
